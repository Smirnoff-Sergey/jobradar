[project]
name = "jobradar"
version = "0.1.0"
description = "Сервис поиска и оценки вакансий"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pwdlib[argon2]>=0.2",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
    "celery[redis]>=5.5",
    "httpx>=0.28",
    "aiogram>=3.31,<4",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "httpx>=0.28",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "N", "RUF"]
# Кириллица в строках и комментариях — не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# Зависимости FastAPI в значениях по умолчанию — штатный приём.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy выполняет часть async-кода в greenlet-ах.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
