server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # DNS Docker: адрес api ищется заново раз в 10 с, а не один раз при старте —
    # пересозданный контейнер api с новым IP не роняет прокси в 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # API, Swagger UI и схема — в контейнер api: интерфейс и API на одном адресе, CORS не нужен.
    location ~ ^/(api/|docs|redoc|openapi\.json) {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы сборки с хешем в имени не меняются — кешируются надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Остальные пути — маршруты SPA: отдаём index.html, роутинг на клиенте.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
        try_files $uri /index.html;
    }
}
