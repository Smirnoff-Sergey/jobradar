x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    JOBRADAR_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobradar}:${POSTGRES_PASSWORD:-jobradar}@postgres:5432/${POSTGRES_DB:-jobradar}
    JOBRADAR_REDIS__URL: redis://redis:6379/0
    JOBRADAR_AUTH__JWT_SECRET: ${JOBRADAR_AUTH__JWT_SECRET:?задайте JOBRADAR_AUTH__JWT_SECRET в .env}

x-after-migrations: &after-migrations
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Миграции применяются отдельным одноразовым контейнером до старта API и воркеров.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on: *after-migrations
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "celery,details,llm,notify", "--loglevel=INFO", "--concurrency=2"]
    depends_on: *after-migrations
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Telegram-бот в режиме polling: кнопки и привязка чата. Без токена сразу завершается.
  # Ровно один экземпляр: Telegram не отдаёт обновления двум getUpdates одновременно.
  bot:
    <<: *backend
    command: ["python", "-m", "app.bot"]
    depends_on: *after-migrations

  # Расписание: ровно один экземпляр, иначе задачи будут ставиться дважды.
  beat:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on: *after-migrations

  # Веб-интерфейс: nginx раздаёт сборку и проксирует /api в контейнер api.
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Мониторинг — по желанию: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jobradar.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
