name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — линтеры и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      JOBRADAR_TEST_DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@localhost:5432/jobradar_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2  # у setup-uv нет плавающих тегов мажорных версий
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Установка зависимостей
        run: uv sync --locked

      - name: Ruff — форматирование
        run: uv run ruff format --check .

      - name: Ruff — линтер
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Тесты
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      # Типы frontend генерируются из этого снимка: схема в backend изменилась — обновите снимок.
      - name: Снимок схемы OpenAPI актуален
        run: |
          uv run python -m app.cli openapi --out ../frontend/openapi.json
          git diff --exit-code ../frontend/openapi.json

  frontend:
    name: Frontend — линтеры, типы и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Типы API актуальны
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.ts

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  docker:
    name: Сборка Docker-образа ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: false
          # Свой scope на образ, иначе кеши backend и frontend перезаписывают друг друга.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
